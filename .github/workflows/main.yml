name: update awesome-stars
on:
  workflow_dispatch:
  schedule:
  - cron: 0 10 * * *
permissions:
  contents: write
jobs:
  awesome-stars:
    name: update awesome-stars
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install starred
    - name: update repo
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: starred --username dotiful --repository starred --sort --token ${GITHUB_TOKEN} --message 'update stars'
